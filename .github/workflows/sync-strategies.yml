name: Sync strategies

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone source repository
        run: |
          git clone --depth 1 \
            https://github.com/rndnaame/nfqws-menu.git \
            /tmp/nfqws-menu

      - name: Sync strategies
        run: |
          rm -rf strategies
          mkdir -p strategies

          cp -a /tmp/nfqws-menu/strategies/blobs \
            strategies/

          cp -a /tmp/nfqws-menu/strategies/lists \
            strategies/

          cp -a /tmp/nfqws-menu/strategies/nfqws2 \
            strategies/

          rm -f strategies/nfqws2/README.md

      - name: Show synced files
        run: |
          echo "=== NFQWS2 ==="
          find strategies/nfqws2 -maxdepth 1 -type f | sort

          echo
          echo "=== BLOBS ==="
          find strategies/blobs -maxdepth 1 -type f | sort

          echo
          echo "=== LISTS ==="
          find strategies/lists -maxdepth 1 -type f | sort

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add strategies

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Sync strategies from rndnaame/nfqws-menu"
          git push
